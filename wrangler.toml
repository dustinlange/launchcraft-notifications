name = "launchcraft-backend"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "launchcraft-db"
database_id = "27390ed7-f70f-42ec-8e9f-29c5131693e1"  # after: wrangler d1 create launchcraft-db

[[kv_namespaces]]
binding = "KV"
id = "17e1e9861c804bb1981e032cbba12eb1"           # after: wrangler kv namespace create launchcraft-kv

# Runs every minute — dispatches due timeline events
[[triggers]]
crons = ["* * * * *"]

# Secrets (set via: wrangler secret put SECRET_NAME)
# APNS_PRIVATE_KEY   — contents of your .p8 file
# APNS_KEY_ID        — 10-char key ID from Apple Developer
# APNS_TEAM_ID       — 10-char team ID from Apple Developer
# WEBHOOK_SECRET     — shared secret for launch data webhooks
